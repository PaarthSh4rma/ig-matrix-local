<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IG Local</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f1117;
      color: #f5f5f5;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }

    .card {
      width: min(520px, 90vw);
      padding: 40px;
      border-radius: 24px;
      background: #171a23;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 42px;
    }

    p {
      color: #b9beca;
      line-height: 1.6;
    }

    .actions {
      display: grid;
      gap: 12px;
      margin-top: 28px;
    }

    a {
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 14px;
      font-weight: 700;
    }

    .primary {
      background: #7c3aed;
      color: white;
    }

    .secondary {
      background: #242936;
      color: #f5f5f5;
    }

    .hint {
      margin-top: 24px;
      font-size: 14px;
      color: #8d94a3;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>IG Local</h1>
    <p>
      Your local-first Instagram messaging app powered by Matrix.
      Private, self-hosted, and running on your machine.
    </p>

    <div class="actions">
      <a class="primary" href="http://localhost:8080">Open Messages</a>
      <a class="secondary" href="http://localhost:8008">Check Synapse</a>
      <a class="secondary" href="https://github.com/PaarthSh4rma/ig-matrix-local">View GitHub Repo</a>
    </div>

    <p class="hint">
      First time? Open Messages, log in, then message <strong>@metabot:localhost</strong>.
    </p>
  </main>
</body>
</html>
